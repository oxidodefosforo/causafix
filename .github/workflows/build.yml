# Compila y prueba CausaFix en Windows (GitHub Actions) y publica el paquete instalable.
# - En cada push / pull request: pruebas (.NET 8 y .NET Framework 4.8) + builds 2024, 2025, 2026.
#   El zip queda en la pestaña Actions -> ejecución -> "Artifacts".
# - En cada push a main (o etiqueta v*): publica o actualiza el Release de la versión con el zip (enlace público fijo:
#   https://github.com/oxidodefosforo/causafix/releases/latest/download/CausaFixIt.zip).
# Las DLL de Revit se toman de los paquetes de referencia Nice3point.Revit.Api (no se distribuyen).
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests (.NET 8)
        run: dotnet run --project tests/CausaFix.Core.Tests -c Release -f net8.0

      - name: Tests (.NET Framework 4.8)
        run: dotnet run --project tests/CausaFix.Core.Tests -c Release -f net48

      - name: Build 2024 / 2025 / 2026 and package
        shell: pwsh
        run: ./build.ps1 -UseRevitNuGet -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: CausaFixIt-package
          path: dist/*.zip

      # Real Project Setup window clicked with the real mouse/keyboard (SendInput) on the runner's desktop.
      # Exit code 2 = input could not reach the window here: reported as a warning, not as passed.
      - name: WPF interaction checks (Project Setup rule list, Project Cleanup window, Keynote Manager)
        timeout-minutes: 10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          dotnet run --project tests/CausaFix.Ui.Tests -c Release -p:RevitVersion=2026 -p:UseRevitNuGet=true *> dist/ui-check-report.txt
          $code = $LASTEXITCODE
          Get-Content dist/ui-check-report.txt
          Get-Content dist/ui-check-report.txt | Select-String -Pattern 'Old template|cause confirmed|did not reproduce|FAIL|passed,' | Select-Object -First 9 | ForEach-Object { Write-Host "::notice title=WPF check::$($_.Line.Trim())" }
          if ($code -eq 2) { Write-Host "::warning::WPF interaction checks could not run on this runner (no interactive input)"; exit 0 }
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-report
          path: dist/ui-check-report.txt

      # Every push to main publishes (or updates) the Release of its version, so the installer always has a public
      # download link: releases/latest/download/CausaFixIt.zip (fixed name) and the versioned zip.
      - name: Release version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          $zip = Get-ChildItem dist -Filter 'CausaFixIt-*.zip' | Select-Object -First 1
          Copy-Item $zip.FullName (Join-Path dist 'CausaFixIt.zip') -Force

      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CausaFixIt ${{ steps.ver.outputs.version }}
          make_latest: true
          overwrite_files: true
          body: |
            Instalador por usuario: descarga **CausaFixIt.zip**, cierra Revit, descomprime y ejecuta `Install.cmd`.
            Commit ${{ github.sha }}.
          files: |
            dist/CausaFixIt.zip
            dist/CausaFixIt-*.zip
