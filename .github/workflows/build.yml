# Compila y prueba CausaFix en Windows (GitHub Actions) y publica el paquete instalable.
# - En cada push / pull request: pruebas (.NET 8 y .NET Framework 4.8) + builds 2024, 2025, 2026.
#   El zip queda en la pestaña Actions -> ejecución -> "Artifacts".
# - Al crear una etiqueta v* (por ejemplo v0.1.0): además crea un Release con el zip.
# Las DLL de Revit se toman de los paquetes de referencia Nice3point.Revit.Api (no se distribuyen).
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tests (.NET 8)
        run: dotnet run --project tests/CausaFix.Core.Tests -c Release -f net8.0

      - name: Tests (.NET Framework 4.8)
        run: dotnet run --project tests/CausaFix.Core.Tests -c Release -f net48

      - name: Build 2024 / 2025 / 2026 and package
        shell: pwsh
        run: ./build.ps1 -UseRevitNuGet -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: CausaFix-package
          path: dist/*.zip

      # Real Project Setup window clicked with the real mouse/keyboard (SendInput) on the runner's desktop.
      # Exit code 2 = input could not reach the window here: reported as a warning, not as passed.
      - name: WPF interaction checks (Project Setup rule list)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          dotnet run --project tests/CausaFix.Ui.Tests -c Release -p:RevitVersion=2026 -p:UseRevitNuGet=true *> dist/ui-check-report.txt
          $code = $LASTEXITCODE
          Get-Content dist/ui-check-report.txt
          Get-Content dist/ui-check-report.txt | Select-String -Pattern 'Old template|cause confirmed|did not reproduce|FAIL|passed,' | Select-Object -First 9 | ForEach-Object { Write-Host "::notice title=WPF check::$($_.Line.Trim())" }
          if ($code -eq 2) { Write-Host "::warning::WPF interaction checks could not run on this runner (no interactive input)"; exit 0 }
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-check-report
          path: dist/ui-check-report.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
